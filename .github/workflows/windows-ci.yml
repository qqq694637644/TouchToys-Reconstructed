name: Windows build and regression tests (unsigned packages)

concurrency:
  group: toucht-toys-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Core logic regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 and 10 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run deterministic gesture and geometry tests
        shell: powershell
        run: dotnet run --project .\tests\TouchToys.RegressionTests\TouchToys.RegressionTests.csproj --configuration Release -r win-x64

  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 35
    needs: regression-tests
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 and 10 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build and package MSIX
        shell: pwsh
        run: .\scripts\Build-Msix.ps1 -Architecture '${{ matrix.arch }}' -Configuration Release -CiManifest

      - name: Verify unsigned MSIX package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Join-Path $env:GITHUB_WORKSPACE 'artifacts\TouchToys-Reconstructed-${{ matrix.arch }}.msix'
          if (-not (Test-Path -LiteralPath $msix)) { throw "MSIX package not found: $msix" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($msix)
          try {
            if ($null -ne $archive.GetEntry('AppxSignature.p7x')) { throw 'MSIX unexpectedly contains a signature.' }
            if ($null -eq $archive.GetEntry('AppxManifest.xml')) { throw 'MSIX manifest is missing.' }
          } finally { $archive.Dispose() }
          Write-Host ('UNSIGNED_MSIX_SHA256=' + (Get-FileHash -LiteralPath $msix -Algorithm SHA256).Hash)

      - name: Upload unsigned MSIX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TouchToys-${{ matrix.arch }}-unsigned-artifacts
          path: |
            artifacts/TouchToys-Reconstructed-${{ matrix.arch }}.msix
          if-no-files-found: error
          retention-days: 30
