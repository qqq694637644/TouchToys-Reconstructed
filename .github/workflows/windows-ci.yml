name: Windows build, smoke tests and screenshots

concurrency:
  group: toucht-toys-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Core logic regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 and 10 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run deterministic gesture and geometry tests
        shell: powershell
        run: dotnet run --project .\tests\TouchToys.RegressionTests\TouchToys.RegressionTests.csproj --configuration Release -r win-x64

  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 35
    needs: regression-tests
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 and 10 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build and package MSIX
        shell: pwsh
        run: .\scripts\Build-Msix.ps1 -Architecture '${{ matrix.arch }}' -Configuration Release -CiManifest

      - name: Sign x64 MSIX for Surface Pro 7 deployment
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Join-Path $env:GITHUB_WORKSPACE 'artifacts\TouchToys-Reconstructed-x64.msix'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=TouchToys-Reconstructed' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -KeyLength 2048 -HashAlgorithm SHA256
          $passwordText = [Guid]::NewGuid().ToString('N')
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $pfx = Join-Path $env:RUNNER_TEMP 'TouchToys-CI.pfx'
          $cer = Join-Path $env:GITHUB_WORKSPACE 'artifacts\TouchToys-Reconstructed-CI.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          $kits = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Windows Kits\10\bin'
          $signtool = Get-ChildItem -LiteralPath $kits -Recurse -File -Filter 'signtool.exe' | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'SignTool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $passwordText $msix
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed: $LASTEXITCODE" }
          Remove-Item -LiteralPath $pfx -Force
          Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force
          Write-Host ('SIGNED_MSIX_SHA256=' + (Get-FileHash $msix -Algorithm SHA256).Hash)

      - name: Upload MSIX and screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TouchToys-${{ matrix.arch }}-artifacts
          path: |
            artifacts/TouchToys-Reconstructed-${{ matrix.arch }}.msix
            artifacts/TouchToys-Reconstructed-CI.cer
          if-no-files-found: warn
          retention-days: 30
