name: Windows build, smoke tests and screenshots

concurrency:
  group: toucht-toys-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Core logic regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run deterministic gesture and geometry tests
        shell: powershell
        run: dotnet run --project .\tests\TouchToys.RegressionTests\TouchToys.RegressionTests.csproj --configuration Release -r win-x64

  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 35
    needs: regression-tests
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and package MSIX
        shell: pwsh
        run: .\scripts\Build-Msix.ps1 -Architecture '${{ matrix.arch }}' -Configuration Release -CiManifest

      - name: Create temporary signing certificate and install x64 package
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Join-Path $env:GITHUB_WORKSPACE 'artifacts\TouchToys-Reconstructed-x64.msix'
          if (-not (Test-Path -LiteralPath $msix)) { throw "MSIX not found: $msix" }

          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=TouchToys-Reconstructed' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeyLength 2048 `
            -HashAlgorithm SHA256

          $plainPassword = [Guid]::NewGuid().ToString('N')
          $securePassword = ConvertTo-SecureString $plainPassword -AsPlainText -Force
          $pfx = Join-Path $env:RUNNER_TEMP 'TouchToys-Reconstructed-CI.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'TouchToys-Reconstructed-CI.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null

          $unlockKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $unlockKey -Force | Out-Null
          New-ItemProperty -Path $unlockKey -Name 'AllowAllTrustedApps' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $unlockKey -Name 'AllowDevelopmentWithoutDevLicense' -PropertyType DWord -Value 1 -Force | Out-Null

          $kits = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Windows Kits\10\bin'
          $signtool = Get-ChildItem -LiteralPath $kits -Recurse -File -Filter 'signtool.exe' |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw 'SignTool.exe was not found.' }

          & $signtool.FullName sign /fd SHA256 /f $pfx /p $plainPassword $msix
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed with exit code $LASTEXITCODE" }

          Write-Host 'Starting AppX deployment (300-second timeout)...'
          $installJob = Start-Job -ScriptBlock {
            param($PackagePath)
            Add-AppxPackage -Path $PackagePath -ForceApplicationShutdown -ErrorAction Stop
          } -ArgumentList $msix
          if (-not (Wait-Job -Job $installJob -Timeout 300)) {
            Stop-Job -Job $installJob -ErrorAction SilentlyContinue
            Receive-Job -Job $installJob -ErrorAction SilentlyContinue | Out-String | Write-Host
            Remove-Job -Job $installJob -Force -ErrorAction SilentlyContinue
            throw 'Add-AppxPackage timed out after 300 seconds.'
          }
          $installState = $installJob.State
          $installOutput = Receive-Job -Job $installJob -ErrorAction SilentlyContinue
          $installOutput | Out-String | Write-Host
          Remove-Job -Job $installJob -Force -ErrorAction SilentlyContinue
          if ($installState -ne 'Completed') { throw "Add-AppxPackage ended in state $installState." }

          $installed = Get-AppxPackage -Name 'TouchToys.Reconstructed' | Select-Object -First 1
          if ($null -eq $installed) { throw 'Package deployment completed but the package is not registered.' }
          Write-Host "Installed package: $($installed.PackageFullName)"

      - name: Run UI and touch smoke tests
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts\smoke-x64'
          .\scripts\Run-SmokeTest.ps1 -OutputDirectory $output -TimeoutSeconds 420 -IncludeTouch

      - name: Run targeted version regression suites
        if: matrix.arch == 'x64'
        shell: powershell
        run: .\scripts\Run-TargetedSmoke.ps1 -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'artifacts\targeted') -TimeoutSeconds 420

      - name: Upload MSIX and screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TouchToys-${{ matrix.arch }}-artifacts
          path: |
            artifacts/TouchToys-Reconstructed-${{ matrix.arch }}.msix
            artifacts/smoke-x64/**
            artifacts/targeted/**
          if-no-files-found: warn
          retention-days: 30
